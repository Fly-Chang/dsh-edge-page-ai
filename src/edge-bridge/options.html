<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSH Page AI 设置</title>
  <style>
    body{font:14px/1.6 system-ui,"Segoe UI",sans-serif;max-width:620px;margin:40px auto;padding:0 20px;color:#1b1f24}
    label{display:block;margin:12px 0 4px;font-weight:600}
    input{box-sizing:border-box;width:100%;padding:8px;border:1px solid #d0d7de;border-radius:6px;font:inherit}
    button{padding:8px 16px;border:1px solid #d0d7de;border-radius:6px;background:#f6f8fa;cursor:pointer;font:inherit}
    #status{min-height:22px;margin-top:12px}
    .err{color:#b42318}.ok{color:#1a7f37}
    code{background:#f2f4f7;padding:2px 6px;border-radius:4px}
  </style>
</head>
<body>
  <h1>DSH Page AI Bridge 设置</h1>
  <p>本扩展是薄壳，只负责把页面桥接到本机 DSH 网关。模型密钥保存在本机 <code>config.local.json</code> 中，不要填在这里。</p>

  <label for="gateway-url">网关地址</label>
  <input id="gateway-url" type="text" placeholder="http://127.0.0.1:8787">

  <label for="token">网关 token</label>
  <input id="token" type="password" placeholder="npm start 输出中的 32 位十六进制 token">
  <p style="color:#667085">在 DSH 插件/网关所在终端运行 <code>npm start</code> 后，会打印 token；也可打开书签页从链接中复制。</p>

  <p>
    <button id="save">保存</button>
    <button id="test">测试连接</button>
  </p>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
